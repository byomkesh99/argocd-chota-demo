apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vm-inventory
  namespace: vm-inventory
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: nginx
  rules:
    - host: vm-inventory.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vm-frontend
                port:
                  number: 80
