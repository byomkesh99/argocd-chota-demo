apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-frontend
spec:
  template:
    spec:
      containers:
        - name: vm-frontend
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx
