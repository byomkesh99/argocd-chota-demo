apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vm-inventory
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: vm-dev-gateway
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - vm-inventory-dev.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vm-frontend
          port: 80
