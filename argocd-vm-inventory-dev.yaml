apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-inventory-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/byomkesh99/argocd-chota-demo.git
    targetRevision: main
    path: apps/vm-inventory-envs/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: vm-inventory-dev

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
